<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Mistype demo</title>
<style>
  :root {
    --bg: #1a1b26;
    --bg2: #16161e;
    --panel: #24283b;
    --panel2: #2a2f45;
    --ink: #c0caf5;
    --dim: #787c99;
    --accent: #7aa2f7;
    --green: #9ece6a;
    --yellow: #e0af68;
    --purple: #bb9af7;
    --selection: rgba(122, 162, 247, 0.35);
    --shadow: 0 18px 50px rgba(0,0,0,0.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans", "DejaVu Sans", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

  .panel {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel2) 100%);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .titlebar {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    color: var(--dim);
    font-size: 18px;
  }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .dots i:nth-child(1) { background: #f7768e; }
  .dots i:nth-child(2) { background: #e0af68; }
  .dots i:nth-child(3) { background: #9ece6a; }

  .scene {
    position: absolute; inset: 0;
    opacity: 0; visibility: hidden;
  }
  .scene.on { opacity: 1; visibility: visible; }

  /* ---------- intro / outro ---------- */
  .center-wrap {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
    background:
      radial-gradient(ellipse 900px 500px at 50% 40%, rgba(122,162,247,0.16), transparent 70%),
      radial-gradient(ellipse 600px 400px at 80% 80%, rgba(187,154,247,0.10), transparent 70%),
      var(--bg);
  }
  .logo-orb {
    width: 220px; height: 220px;
    border-radius: 52px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, rgba(122,162,247,0.28), rgba(187,154,247,0.12) 60%, transparent 75%);
    filter: drop-shadow(0 22px 50px rgba(122,162,247,0.35));
  }
  .logo-orb svg { width: 200px; height: 200px; display: block; }
  .center-wrap h1 {
    font-size: 84px; font-weight: 800; letter-spacing: -2px;
    background: linear-gradient(90deg, #c0caf5, #7dcfff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .center-wrap .sub {
    font-size: 30px; color: var(--dim); text-align: center; line-height: 1.4;
    max-width: 1000px;
  }
  .center-wrap .sub b { color: var(--ink); font-weight: 600; }

  /* ---------- desk / editor ---------- */
  .desk {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 1000px 600px at 70% 20%, rgba(122,162,247,0.12), transparent 60%),
      linear-gradient(160deg, #1f2335 0%, #16161e 55%, #1a1b26 100%);
  }
  .window {
    position: absolute;
    left: 140px; top: 140px;
    width: 1180px; height: 680px;
  }
  .editor-body {
    padding: 40px 44px;
    font-family: "DejaVu Sans Mono", "JetBrains Mono", "Noto Sans Mono", monospace;
    font-size: 36px;
    line-height: 1.85;
    color: #a9b1d6;
  }
  .ln { display: flex; gap: 28px; min-height: 1.85em; }
  .ln .num { color: #4a5070; min-width: 36px; text-align: right; user-select: none; }
  .typed { white-space: pre-wrap; min-height: 1.85em; }
  .sel {
    background: var(--selection);
    border-radius: 4px;
    padding: 2px 4px;
    box-shadow: 0 0 0 1px rgba(122,162,247,0.45);
  }
  .caret {
    display: inline-block;
    width: 3px; height: 1.05em;
    background: var(--accent);
    vertical-align: text-bottom;
    margin-left: 2px;
    opacity: 0;
  }
  .caret.blink { opacity: 1; }

  /* side caption */
  .caption {
    position: absolute;
    left: 1380px; top: 200px;
    width: 420px;
    padding: 28px 30px;
    border-radius: 18px;
    background: rgba(36, 40, 59, 0.92);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: var(--shadow);
  }
  .caption .kicker {
    font-size: 15px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 12px; font-weight: 700;
  }
  .caption h2 {
    font-size: 34px; line-height: 1.25; margin-bottom: 12px; font-weight: 700;
  }
  .caption p {
    font-size: 21px; line-height: 1.45; color: var(--dim);
  }
  .caption p b { color: var(--ink); font-weight: 600; }

  /* hotkey chip */
  .hotkey {
    position: absolute;
    left: 1380px; top: 620px;
    width: 420px;
    padding: 22px 24px;
    border-radius: 16px;
    background: rgba(22, 22, 30, 0.95);
    border: 1px solid rgba(122,162,247,0.35);
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    opacity: 0;
  }
  .hotkey .label {
    font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--dim); margin-bottom: 14px;
  }
  .keys { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .key {
    min-width: 64px;
    padding: 12px 16px;
    border-radius: 12px;
    background: linear-gradient(180deg, #2f3550, #24283b);
    border: 1px solid rgba(255,255,255,0.12);
    border-bottom-width: 3px;
    color: var(--ink);
    font-family: "DejaVu Sans Mono", monospace;
    font-size: 22px;
    font-weight: 600;
    text-align: center;
  }
  .key.down {
    transform: translateY(2px);
    background: linear-gradient(180deg, #7aa2f7, #5d82d8);
    color: #16161e;
    border-color: #9bb7f8;
  }
  .plus { color: var(--dim); font-size: 22px; font-weight: 600; }

  /* taskbar / tray */
  .taskbar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 64px;
    background: rgba(22, 22, 30, 0.92);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center;
    padding: 0 28px;
    justify-content: flex-end;
    gap: 18px;
    z-index: 20;
  }
  .tray-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    background: rgba(255,255,255,0.04);
  }
  .tray-icon svg { width: 34px; height: 34px; display: block; }
  .tray-icon.flash {
    box-shadow: 0 0 0 5px rgba(224,175,104,0.40), 0 0 28px rgba(224,175,104,0.75);
    background: rgba(224,175,104,0.18);
  }
  .tray-icon.busy {
    box-shadow: 0 0 0 5px rgba(224,175,104,0.35), 0 0 28px rgba(224,175,104,0.65);
    background: rgba(224,175,104,0.16);
  }
  .tray-icon.busy svg { filter: sepia(1) saturate(2.2) hue-rotate(-10deg) brightness(1.05); }
  .clock {
    color: var(--dim); font-size: 18px; font-variant-numeric: tabular-nums;
    min-width: 72px;
  }

  /* outro */
  .outro-wrap {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 36px;
    background:
      radial-gradient(ellipse 900px 500px at 50% 35%, rgba(187,154,247,0.14), transparent 70%),
      var(--bg);
  }
  .outro-wrap h1 {
    font-size: 64px; font-weight: 800; letter-spacing: -1.5px;
  }
  .cheat {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 40px;
    width: 1100px;
  }
  .cheat-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 26px;
    background: rgba(36, 40, 59, 0.85);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
  }
  .cheat-row .what { font-size: 24px; color: var(--ink); }
  .cheat-row .combo { display: flex; gap: 8px; }
  .cheat-row .key {
    min-width: 48px; padding: 8px 12px; font-size: 18px; border-radius: 10px;
  }
  .outro-note { font-size: 22px; color: var(--dim); }
  .outro-note b { color: var(--accent); font-weight: 600; }

  #progress {
    position: absolute; left: 0; top: 0; height: 5px; width: 0;
    background: linear-gradient(90deg, #7aa2f7, #bb9af7, #7dcfff);
    z-index: 50;
    opacity: 0.85;
  }
</style>
</head>
<body>
<!-- shared icon: assets/icons/mistype.svg -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mistype-icon" viewBox="0 0 64 64">
    <rect x="4" y="12" width="56" height="40" rx="8" fill="#2b2e3b"/>
    <rect x="8" y="16" width="48" height="32" rx="6" fill="#3d4254"/>
    <rect x="12" y="22" width="14" height="10" rx="2" fill="#5b9cff"/>
    <rect x="38" y="22" width="14" height="10" rx="2" fill="#ff7a59"/>
    <path d="M28 27h8m0 0l-3-3m3 3l-3 3" stroke="#e8eaf0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 37h-8m0 0l3-3m-3 3l3 3" stroke="#e8eaf0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="16" y="38" width="32" height="6" rx="2" fill="#5a6078"/>
  </symbol>
</svg>

<div id="stage">
  <div id="progress"></div>

  <!-- ============ INTRO ============ -->
  <section class="scene" id="scene-intro">
    <div class="center-wrap" id="intro-wrap">
      <div class="logo-orb" id="intro-logo">
        <svg viewBox="0 0 64 64"><use href="#mistype-icon"/></svg>
      </div>
      <h1>Mistype</h1>
      <div class="sub">
        Раскладка <b>EN↔RU</b> и <b>LLM-чистка</b> выделенного<br>
        для KDE Plasma 6
      </div>
    </div>
  </section>

  <!-- ============ EDITOR ============ -->
  <section class="scene" id="scene-app">
    <div class="desk" id="desk">
      <div class="window panel">
        <div class="titlebar">
          <div class="dots"><i></i><i></i><i></i></div>
          <div>заметки.md</div>
        </div>
        <div class="editor-body">
          <div class="ln">
            <div class="num">1</div>
            <div class="typed"><span id="text1"></span><span class="caret" id="caret1"></span></div>
          </div>
          <div class="ln">
            <div class="num">2</div>
            <div class="typed"><span id="text2"></span><span class="caret" id="caret2"></span></div>
          </div>
        </div>
      </div>

      <div class="caption">
        <div class="kicker" id="cap-kicker"></div>
        <h2 id="cap-title"></h2>
        <p id="cap-body"></p>
      </div>

      <div class="hotkey" id="hotkey">
        <div class="label">Горячая клавиша</div>
        <div class="keys" id="keys"></div>
      </div>

      <div class="taskbar">
        <div class="tray-icon" id="tray">
          <svg viewBox="0 0 64 64"><use href="#mistype-icon"/></svg>
        </div>
        <div class="clock">12:41</div>
      </div>
    </div>
  </section>

  <!-- ============ OUTRO ============ -->
  <section class="scene" id="scene-outro">
    <div class="outro-wrap" id="outro-wrap">
      <h1>Одна клавиша — и текст в порядке</h1>
      <div class="cheat" id="cheat"></div>
      <div class="outro-note">Трей · настройки · <b>Plasma-виджет</b> с историей LLM</div>
    </div>
  </section>
</div>

<script>
(function () {
  const DURATION = 18.5;

  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const range = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const ease = (x) => 1 - Math.pow(1 - x, 3);

  function setScene(id, on) {
    $(id).classList.toggle('on', on);
  }

  function setKeys(list, pressedIdx) {
    const box = $('keys');
    box.innerHTML = '';
    list.forEach((k, i) => {
      if (i > 0) {
        const p = document.createElement('span');
        p.className = 'plus';
        p.textContent = '+';
        box.appendChild(p);
      }
      const el = document.createElement('div');
      el.className = 'key' + (pressedIdx === i || pressedIdx === -1 ? ' down' : '');
      el.textContent = k;
      box.appendChild(el);
    });
  }

  function setCheat() {
    const rows = [
      { what: 'Исправить раскладку', keys: ['Ctrl', 'Alt', 'R'] },
      { what: 'LLM-исправление', keys: ['Alt', 'R'] },
      { what: 'Отменить замену', keys: ['Backspace'] },
      { what: 'Пауза / включить', keys: ['Ctrl', 'Alt', 'T'] },
    ];
    const root = $('cheat');
    if (root.childElementCount) return;
    rows.forEach((r) => {
      const row = document.createElement('div');
      row.className = 'cheat-row';
      const w = document.createElement('div');
      w.className = 'what';
      w.textContent = r.what;
      const c = document.createElement('div');
      c.className = 'combo';
      r.keys.forEach((k) => {
        const el = document.createElement('div');
        el.className = 'key';
        el.textContent = k;
        c.appendChild(el);
      });
      row.appendChild(w);
      row.appendChild(c);
      root.appendChild(row);
    });
  }

  function showHotkey(opacity, y) {
    const el = $('hotkey');
    el.style.opacity = String(opacity || 0);
    if (y != null) el.style.top = y + 'px';
  }

  function trayState(state) {
    $('tray').className = 'tray-icon' + (state ? ' ' + state : '');
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function setLine(n, html) {
    $('text' + n).innerHTML = html;
  }

  function typeInto(spanId, text, n, selected) {
    const shown = text.slice(0, Math.max(0, n));
    const rest = text.slice(Math.max(0, n));
    if (selected) {
      $(spanId).innerHTML = '<span class="sel">' + escapeHtml(shown) + '</span>' + escapeHtml(rest);
    } else {
      $(spanId).textContent = shown;
    }
  }

  function blinkCaret(id, on) {
    $(id).classList.toggle('blink', on);
  }

  function setCaption(kicker, title, body) {
    $('cap-kicker').textContent = kicker;
    $('cap-title').textContent = title;
    $('cap-body').innerHTML = body;
  }

  // hard swap at midpoint — the app replaces text instantly, no crossfade
  function morphLine(n, from, to, m) {
    const text = m < 0.5 ? from : to;
    setLine(n, '<span class="sel">' + escapeHtml(text) + '</span>');
  }

  // ---- content ----
  const WRONG = 'ghbdtn vbh';
  const RIGHT = 'привет мир';
  const MESSY = 'ну это самое, кароче надо сделать штото';
  const CLEAN = 'Нужно сделать кое-что важное.';

  function seek(t) {
    $('progress').style.width = (t / DURATION * 100) + '%';

    // ========== INTRO 0–2.2 ==========
    if (t < 2.2) {
      setScene('scene-intro', true);
      setScene('scene-app', false);
      setScene('scene-outro', false);

      const a = ease(range(t, 0.05, 0.7));
      const logo = $('intro-logo');
      const h1 = document.querySelector('#intro-wrap h1');
      const sub = document.querySelector('#intro-wrap .sub');
      logo.style.transform = 'scale(' + (0.9 + 0.1 * a) + ')';
      logo.style.opacity = String(a);
      h1.style.opacity = String(ease(range(t, 0.2, 0.85)));
      h1.style.transform = 'translateY(' + (1 - ease(range(t, 0.2, 0.85))) * 22 + 'px)';
      sub.style.opacity = String(ease(range(t, 0.45, 1.1)));
      $('intro-wrap').style.opacity = String(1 - range(t, 1.9, 2.2));
      return;
    }

    // ========== APP 2.2–16.0 ==========
    if (t < 16.0) {
      setScene('scene-intro', false);
      setScene('scene-app', true);
      setScene('scene-outro', false);
      $('intro-wrap').style.opacity = '1';

      blinkCaret('caret1', false);
      blinkCaret('caret2', false);
      showHotkey(0);
      trayState('');

      // ----- A: convert  2.2–7.5 -----
      if (t < 7.5) {
        setLine(1, '');
        setLine(2, '');
        setCaption(
          'Раскладка',
          'Не та раскладка',
          'Выделите текст и нажмите <b>Ctrl+Alt+R</b> — Mistype перевернёт EN↔RU.'
        );

        // type wrong 2.4–3.9
        if (t < 3.9) {
          const n = Math.floor(range(t, 2.4, 3.9) * WRONG.length);
          typeInto('text1', WRONG, n, false);
          blinkCaret('caret1', Math.floor(t * 2) % 2 === 0);
        }

        // select 3.9–5.3
        if (t >= 3.9 && t < 5.3) {
          typeInto('text1', WRONG, WRONG.length, t >= 4.2);
        }

        // hotkey chip 4.3–5.9
        if (t >= 4.3 && t < 5.9) {
          showHotkey(ease(range(t, 4.3, 4.7)), 620);
          if (t < 5.35) {
            const idx = t < 4.7 ? 0 : t < 5.0 ? 1 : t < 5.3 ? 2 : -1;
            setKeys(['Ctrl', 'Alt', 'R'], idx);
          } else {
            setKeys(['Ctrl', 'Alt', 'R'], -1);
          }
        }

        // morph + tray flash 5.3–6.4
        if (t >= 5.3) {
          morphLine(1, WRONG, RIGHT, ease(range(t, 5.3, 6.1)));
          if (t >= 5.35 && t < 6.4) {
            trayState(Math.floor((t - 5.35) * 6) % 2 === 0 ? 'flash' : '');
          }
        }
      }

      // ----- B: LLM  7.5–13.0 -----
      else if (t < 13.0) {
        setLine(1, escapeHtml(RIGHT));
        setLine(2, '');
        setCaption(
          'LLM',
          'Чистка выделенного',
          '<b>Alt+R</b> отправляет выделенное в LLM и заменяет результатом.'
        );

        // type messy 7.6–9.1
        if (t < 9.1) {
          const n = Math.floor(range(t, 7.6, 9.1) * MESSY.length);
          typeInto('text2', MESSY, n, false);
          blinkCaret('caret2', Math.floor(t * 2) % 2 === 0);
        }

        // select 9.1–11.8
        if (t >= 9.1 && t < 11.8) {
          setLine(2, '<span class="sel">' + escapeHtml(MESSY) + '</span>');
        }

        // hotkey Alt+R 9.4–11.2
        if (t >= 9.4 && t < 11.2) {
          showHotkey(ease(range(t, 9.4, 9.8)), 620);
          if (t < 10.3) setKeys(['Alt', 'R'], t < 9.9 ? 0 : 1);
          else setKeys(['Alt', 'R'], -1);
        }

        // tray busy while "LLM thinks" 10.2–11.8
        if (t >= 10.2 && t < 11.8) {
          trayState(Math.floor((t - 10.2) * 4) % 2 === 0 ? 'busy' : '');
        }

        // morph + flash 11.8–12.9
        if (t >= 11.8) {
          morphLine(2, MESSY, CLEAN, ease(range(t, 11.8, 12.6)));
          if (t >= 11.85 && t < 12.9) {
            trayState(Math.floor((t - 11.85) * 6) % 2 === 0 ? 'flash' : '');
          }
        }
      }

      // ----- C: undo  13.0–16.0 -----
      else {
        setLine(1, escapeHtml(RIGHT));
        setCaption(
          'Отмена',
          'Откат замены',
          'Одна <b>Backspace</b> в течение ~4 с возвращает исходный текст.'
        );

        setLine(2, '<span class="sel">' + escapeHtml(CLEAN) + '</span>');

        // hotkey Backspace 13.2–14.2
        if (t >= 13.2 && t < 14.2) {
          showHotkey(ease(range(t, 13.2, 13.55)), 620);
          setKeys(['Backspace'], t < 13.85 ? 0 : -1);
        }

        // undo morph + flash 14.1–15.2
        if (t >= 14.1) {
          morphLine(2, CLEAN, MESSY, ease(range(t, 14.1, 14.9)));
          if (t >= 14.15 && t < 15.2) {
            trayState(Math.floor((t - 14.15) * 6) % 2 === 0 ? 'flash' : '');
          }
        }
      }

      $('desk').style.opacity = String(1 - range(t, 15.6, 16.0));
      return;
    }

    // ========== OUTRO 16.0–18.5 ==========
    setScene('scene-intro', false);
    setScene('scene-app', false);
    setScene('scene-outro', true);
    $('desk').style.opacity = '1';
    setCheat();
    const o = ease(range(t, 16.0, 16.7));
    $('outro-wrap').style.opacity = String(o);
    document.querySelector('#outro-wrap h1').style.transform =
      'translateY(' + (1 - o) * 18 + 'px)';
  }

  window.__seek = seek;
  window.__DURATION = DURATION;
  seek(0);
})();
</script>
</body>
</html>
