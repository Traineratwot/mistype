[workspace]
resolver = "2"
members = [
    "crates/mistype-domain",
    "crates/mistype-app",
    "crates/mistype-adapters",
    "crates/mistype-ui",
    "crates/mistype-daemon",
    "crates/mistype-tests",
]

[workspace.package]
version = "3.0.1"
edition = "2021"
license = "MIT"
authors = ["Mistype contributors"]
repository = "https://github.com/Traineratwot/mistype"
description = "Fix text typed in the wrong keyboard layout — Linux/KDE answer to Punto Switcher"

[workspace.dependencies]
mistype-domain = { path = "crates/mistype-domain" }
mistype-app = { path = "crates/mistype-app" }
mistype-adapters = { path = "crates/mistype-adapters" }
mistype-ui = { path = "crates/mistype-ui" }

async-trait = "0.1"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "io-util", "net"] }
zbus = "5"
evdev = "0.13"
clap = { version = "4", features = ["derive"] }
ksni = "0.2"
iced = { version = "0.13", features = ["tokio"] }
arboard = "3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
